# Takes screenshots of every style and commits them to docs/screenshots/.
# Runs when you start it from the Actions tab ("Run workflow"), or on a push whose
# commit message contains [screenshots].
name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm run build
      - run: node scripts/check-links.mjs
      - name: Install browser
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Take screenshots
        run: |
          npx astro preview --port 4321 &
          for i in $(seq 1 30); do curl -sf http://localhost:4321/Claude-Website/ >/dev/null && break; sleep 1; done
          node scripts/screenshots.mjs
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update screenshots [skip ci]" || exit 0
          git push
